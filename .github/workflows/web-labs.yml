name: Web programming labs
on:
  push:
    branches: [web-programming-labs]
    paths: ['web-labs/**', '.github/workflows/web-labs.yml']
  pull_request:
    paths: ['web-labs/**', '.github/workflows/web-labs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-labs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 'web-labs/**/pom.xml'
      - name: Install browser and terminal tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xterm imagemagick fonts-dejavu-core libnss3-tools
          python3 -m pip install -r web-labs/ci/requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Build and verify all web labs
        working-directory: web-labs
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 ci/evidence.py
      - name: Retain genuine execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-labs-evidence
          path: web-labs/evidence
          if-no-files-found: warn
          retention-days: 30
