name: Eclipse lab verification
on:
  push:
    branches: [web-labs-eclipse-check]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eclipse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install IDE display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb imagemagick libgtk-3-0 libasound2t64 fonts-dejavu-core
      - name: Verify Eclipse Maven and Tomcat integration
        working-directory: web-labs
        run: xvfb-run -a -s '-screen 0 1600x1000x24' python3 ci/ide/check_ide.py
      - name: Retain Eclipse screenshots and protocol
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-labs-ide-evidence
          path: web-labs/evidence-ide
          if-no-files-found: warn
          retention-days: 30
